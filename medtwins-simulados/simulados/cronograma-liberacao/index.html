<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma de Liberação MedTwins</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--navy:#030a1c;--panel:#071229;--line:#203355;--green:#13ed56;--text:#f3f6ff;--muted:#8e9ab4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--text);font-family:'Satoshi',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 42% 100%,rgba(0,197,211,.12),transparent 34%),linear-gradient(115deg,rgba(16,58,133,.24),transparent 42%),var(--navy);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(116deg,transparent 0,transparent 12px,rgba(103,141,205,.18) 13px,transparent 14px)}
.page{position:relative;z-index:1;width:min(1728px,100%);min-height:100vh;margin:0 auto;padding:clamp(34px,5vw,76px) clamp(24px,5vw,82px);display:grid;grid-template-columns:minmax(520px,1fr) minmax(480px,.95fr);gap:clamp(38px,4.5vw,76px);align-items:center}
.content{min-width:0}.brand{width:clamp(175px,15vw,235px);height:auto;display:block;margin-bottom:52px}
.eyebrow{display:flex;align-items:center;gap:14px;color:#9aa5be;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:0 0 20px}.eyebrow:before{content:"";width:38px;height:3px;background:var(--green);border-radius:4px}
h1{font-size:clamp(48px,4.2vw,76px);line-height:.91;letter-spacing:-.045em;margin:0 0 20px;max-width:650px}h1 span{display:block}
.subtitle{color:var(--muted);font-size:clamp(16px,1.25vw,21px);margin:0 0 38px}
.schedule{position:relative;display:grid;width:100%;min-width:0;gap:13px;padding-left:58px}.schedule:before{content:"";position:absolute;left:5px;top:42px;bottom:42px;width:2px;background:linear-gradient(var(--green),#263a62 20%,#263a62)}
.release{position:relative;display:flex;width:100%;max-width:100%;min-width:0;align-items:center;gap:22px;min-height:78px;padding:14px 24px;border:1px solid rgba(106,127,164,.25);border-radius:17px;background:linear-gradient(105deg,rgba(30,46,74,.62),rgba(7,15,34,.78));color:#c6ccda;text-decoration:none;transition:border-color .2s,transform .2s,background .2s,opacity .2s}
.release:before{content:"";position:absolute;left:-57px;top:50%;width:9px;height:9px;border:2px solid #41557d;border-radius:50%;background:#0a1429;transform:translateY(-50%)}
.release.has-link:hover{transform:translateX(4px);border-color:rgba(19,237,86,.55)}.release:not(.has-link){cursor:default}
.release.is-checked{border-color:rgba(19,237,86,.58);background:linear-gradient(105deg,rgba(7,89,49,.42),rgba(7,15,34,.82));color:#fff}.release.is-checked:before{background:var(--green);border-color:var(--green);box-shadow:0 0 0 7px rgba(19,237,86,.13),0 0 18px rgba(19,237,86,.65)}
.date{flex:none;min-width:96px;padding:10px 14px;text-align:center;border:1px solid rgba(130,148,181,.28);border-radius:10px;background:rgba(126,143,174,.09);font-size:18px;font-weight:700;letter-spacing:.04em}.is-checked .date{border-color:rgba(19,237,86,.54);background:rgba(19,237,86,.13);color:#70ff9b}
.label{flex:1;min-width:0;font-size:clamp(15px,1.25vw,20px);line-height:1.2;font-weight:700;letter-spacing:.035em;text-transform:uppercase;white-space:normal;overflow-wrap:anywhere}.icon{flex:none;width:25px;text-align:center;font-size:24px;line-height:1;color:#66738d}.is-checked .icon{position:relative;display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--green);border-radius:50%;background:rgba(19,237,86,.12);font-size:0;color:var(--green)}.is-checked .icon:before{content:"";width:8px;height:4px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-1px) rotate(-45deg)}
.visual{position:relative;overflow:hidden;width:100%;aspect-ratio:.92;border-radius:30px;background:linear-gradient(145deg,#143ba9,#154be3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 30px 80px rgba(0,0,0,.28)}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;display:block}
.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1050px){.page{grid-template-columns:1fr;max-width:780px}.visual{order:-1;aspect-ratio:1.18}.brand{margin-bottom:34px}.visual img{object-position:right center}}
@media(max-width:620px){.page{padding:32px 16px 42px}.visual{display:none}.schedule{width:calc(100vw - 32px);padding-left:31px}.schedule:before{left:3px}.release{width:calc(100vw - 63px);padding:12px 14px;gap:12px;border-radius:13px;min-height:70px}.release:before{left:-32px}.date{min-width:72px;font-size:14px;padding:9px 8px}.label{font-size:12px}.icon{width:18px;font-size:19px}.brand{width:170px}h1{font-size:46px}}
</style>
</head>
<body>
<main class="page">
  <section class="content" aria-labelledby="page-title">
    <img class="brand" src="assets/logo-medtwins.png" alt="MedTwins Revalided">
    <p class="eyebrow">Revalida INEP</p>
    <h1 id="page-title"><span>Cronograma</span><span>de liberação</span></h1>
    <p class="subtitle">Uma área nova por dia, de 6 a 11 de setembro.</p>
    <nav class="schedule" aria-label="Simulados disponíveis">
      <a class="release" data-release-id="pediatria"><span class="date">06/09</span><span class="label">Pediatria</span><span class="icon" aria-hidden="true">›</span></a>
      <a class="release" data-release-id="ginecologia-obstetricia"><span class="date">07/09</span><span class="label">Ginecologia e Obstetrícia</span><span class="icon" aria-hidden="true">›</span></a>
      <a class="release" data-release-id="cirurgia"><span class="date">08/09</span><span class="label">Cirurgia</span><span class="icon" aria-hidden="true">›</span></a>
      <a class="release" data-release-id="preventiva-saude-coletiva"><span class="date">09/09</span><span class="label">Medicina Preventiva / Saúde Coletiva</span><span class="icon" aria-hidden="true">›</span></a>
      <a class="release" data-release-id="clinica-medica"><span class="date">10/09</span><span class="label">Clínica Médica</span><span class="icon" aria-hidden="true">›</span></a>
      <a class="release" data-release-id="simulado-geral"><span class="date">11/09</span><span class="label">Simulado Geral INEP</span><span class="icon" aria-hidden="true">›</span></a>
    </nav>
  </section>
  <aside class="visual" aria-label="Equipe MedTwins">
    <img src="assets/hero-painel.png" alt="Professores da MedTwins">
  </aside>
</main>
<script>
(function () {
  var initialConfig = {};
  try {
    if (window.parent && window.parent !== window && window.parent.MedTwinsReleaseConfig) {
      initialConfig = window.parent.MedTwinsReleaseConfig;
    }
  } catch (e) {}

  function applyConfig(config) {
    document.querySelectorAll('[data-release-id]').forEach(function (button) {
      var item = config[button.getAttribute('data-release-id')] || {};
      var icon = button.querySelector('.icon');
      var label = button.querySelector('.label').textContent;
      button.classList.toggle('is-checked', Boolean(item.checked));
      button.classList.toggle('has-link', Boolean(item.url));
      icon.textContent = item.checked ? '' : '›';
      button.removeAttribute('href');
      button.removeAttribute('target');
      button.removeAttribute('rel');
      button.setAttribute('aria-label', label + (item.checked ? ', liberado' : ''));
      if (item.url) {
        button.href = item.url;
        button.target = '_top';
        button.rel = 'noopener';
        button.removeAttribute('aria-disabled');
      } else {
        button.setAttribute('aria-disabled', 'true');
      }
    });
  }

  applyConfig(initialConfig);

  var endpoint = new URLSearchParams(window.location.search).get('mt_endpoint');
  if (endpoint) {
    fetch(endpoint + (endpoint.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now(), {
      credentials: 'same-origin',
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    })
      .then(function (response) {
        if (!response.ok) throw new Error('Configuração indisponível');
        return response.json();
      })
      .then(applyConfig)
      .catch(function () { applyConfig(initialConfig); });
  }
}());
</script>
</body>
</html>
